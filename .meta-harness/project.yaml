# RFBrowser — Meta-Harness Project Configuration
# Schema version: 2.0.0

project:
  name: "RFBrowser"
  description: "AI-Powered Knowledge Browser — Flutter desktop app"
  schema_version: "2.0.0"

# === 仓库 ===
repos:
  - name: rfbrowser
    url: git@github.com:eeyzs1/rfbrowser.git
    language: dart
    branch: main
    path: "."
    build_command: "flutter build windows --debug"
    typecheck_command: "flutter analyze"
    lint_command: "flutter analyze"
    test_command: "flutter test"

meta_harness_version: "2.5.0"

# === 运行模式 ===
# fast: 跳过 brainstorm + code-review，适合小改动和 bugfix
# full: 默认，完整 pipeline
# deep: 额外 research + pair-review，适合复杂架构决策
run_mode: "full"

# === Phase 类型 ===
phases: [plan, implement, test]

# === 质量门 ===
quality_gates:
  - name: lint
    repo: "rfbrowser"
    command: "flutter analyze"
  - name: test
    repo: "rfbrowser"
    command: "flutter test"
  - name: build
    repo: "rfbrowser"
    command: "flutter build windows --debug"
  # 真机冒烟测试（2026-06-25 新增）：3 步静态门通过后强制执行
  # 详见 .trae/rules/project_rules.md 规则 5
  - name: runtime_smoke_test
    repo: "rfbrowser"
    command: "flutter run -d windows"
    type: manual
    checklist:
      - "滚动设置页每个 section 至底部（验证无 AXTree 崩溃）"
      - "打开一个 >20KB 的 markdown 笔记（验证无卡顿，<2s 打开）"
      - "切换 edit/source/rendered 视图模式（验证切换正常）"
      - "分屏操作 + 标签栏滚轮/拖拽/中键关闭（验证手势正常）"
    note: "AI 必须在 3 步静态门通过后主动提醒用户执行此 checklist"

# === 技能-Phase 映射 ===
phase_skills:
  plan:
    - brainstorming
    - writing-plans
  implement:
    - tdd
    - subagent-driven-dev
    - executing-plans
  test:
    - code-review
    - verification
    - systematic-debugging
  post-audit:
    - finishing-a-development-branch

cross_phase_skills:
  - dispatching-parallel-agents

# === 适配器 ===
adapters:
  ci:
    type: "github-actions"
  executor:
    type: "sub-agent"
  work_item:
    type: "file"
    path: ".meta-harness/work-items.json"

# === 分支策略 ===
branch:
  prefix: "meta-harness/"
  merge_strategy: "incremental"
  template: "feature/{work_item_id}"
  base: "origin/main"
  sync: "rebase"

# === 证据 ===
evidence:
  required_artifacts:
    - "flutter analyze"
    - "flutter test"
    - "flutter build windows --debug"
    - "runtime smoke test checklist (manual)"
  quality_gate: "meta-harness/seeds/verification/quality-gate.py"
  required_kinds: [screenshot, log, test-report]
  # 运行时陷阱清单（2026-06-25 新增）：基于历史崩溃/卡顿教训
  runtime_pitfalls:
    - pattern: "ReorderableListView.builder + shrinkWrap:true + NeverScrollableScrollPhysics in parent Scrollable"
      impact: "Windows AXTree corruption → process crash"
      fix: "Column + up/down IconButtons"
    - pattern: "TextField(maxLines: null, expands: true) on >20KB content"
      impact: "UI thread layout freeze"
      fix: "ListView.builder viewport rendering"
    - pattern: "Synchronous regex scan in buildTextSpan/build"
      impact: "UI blocks on every keystroke"
      fix: "Return plain text immediately, async debounced scan"
    - pattern: "Horizontal ListView without PointerScrollEvent handling on Windows"
      impact: "Mouse wheel does not scroll"
      fix: "Listener(onPointerSignal) + scrollDelta.dy→jumpTo"

# === 记忆 ===
memory:
  enabled: true
  dir: ".meta-harness/memory"
  max_files: 50

# === 运行时目录 ===
runtime:
  dir: ".meta-harness"
  runs_dir: ".meta-harness/runs"