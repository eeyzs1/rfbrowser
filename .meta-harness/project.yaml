# RFBrowser — Meta-Harness Project Configuration
# Schema version: 2.0.0

project:
  name: "RFBrowser"
  description: "AI-Powered Knowledge Browser — Flutter desktop app"
  schema_version: "2.0.0"

# === 仓库 ===
repos:
  - name: rfbrowser
    url: git@github.com:eeyzs1/rfbrowser.git
    language: dart
    branch: main
    path: "."
    build_command: "flutter build windows --debug"
    typecheck_command: "flutter analyze"
    lint_command: "flutter analyze"
    test_command: "flutter test"

meta_harness_version: "2.0.0"

# === 运行模式 ===
# fast: 跳过 brainstorm + code-review，适合小改动和 bugfix
# full: 默认，完整 pipeline
# deep: 额外 research + pair-review，适合复杂架构决策
run_mode: "full"

# === Phase 类型 ===
phases: [plan, implement, test]

# === 质量门 ===
quality_gates:
  - name: lint
    repo: "rfbrowser"
    command: "flutter analyze"
  - name: test
    repo: "rfbrowser"
    command: "flutter test"
  - name: build
    repo: "rfbrowser"
    command: "flutter build windows --debug"

# === 技能-Phase 映射 ===
phase_skills:
  plan:
    - brainstorming
    - writing-plans
  implement:
    - tdd
    - subagent-driven-dev
    - executing-plans
  test:
    - code-review
    - verification
    - systematic-debugging
  post-audit:
    - finishing-a-development-branch

cross_phase_skills:
  - dispatching-parallel-agents

# === 适配器 ===
adapters:
  ci:
    type: "github-actions"
  executor:
    type: "sub-agent"
  work_item:
    type: "file"
    path: ".meta-harness/work-items.json"

# === 分支策略 ===
branch:
  prefix: "meta-harness/"
  merge_strategy: "incremental"
  template: "feature/{work_item_id}"
  base: "origin/main"
  sync: "rebase"

# === 证据 ===
evidence:
  required_artifacts:
    - "flutter analyze"
    - "flutter test"
    - "flutter build windows --debug"
  quality_gate: "meta-harness/seeds/verification/quality-gate.py"
  required_kinds: [screenshot, log, test-report]

# === 记忆 ===
memory:
  enabled: true
  dir: ".meta-harness/memory"
  max_files: 50

# === 运行时目录 ===
runtime:
  dir: ".meta-harness"
  runs_dir: ".meta-harness/runs"