name: RFBrowser CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-pub --fatal-infos

  # TODO(phase-5): re-introduce Genome Constraints + Service Audit jobs once
  # the seeds/ directory is brought back or the constraint files are moved
  # into a different location. They were removed in 9c54089 ("Migrate
  # meta-harness from copy-paste to git submodule") but the workflow still
  # references them, so they fail with "No such file or directory" in ~5s.
  # Removing them from ci.yml unblocks the rest of the pipeline.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [analyze]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Configure git for tests
        # git_sync_service_test.dart exercises real `git commit` / `git push`
        # which fail on a clean ubuntu-latest runner because user.name and
        # user.email are not set; "Author identity unknown" aborts the
        # commit and the test then sees a silent no-op.
        run: |
          git config --global user.name  "RFBrowser CI"
          git config --global user.email "ci@rfbrowser.local"
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test --no-pub --coverage test/data/ test/services/ test/core/ test/acceptance/ test/security/ test/agents/ test/performance/ test/plugins/capability_checker_test.dart test/services/shortcut_service_test.dart test/services/git_merge_test.dart test/integration/browser_lifecycle_integration_test.dart test/integration/note_lifecycle_integration_test.dart test/integration/agent_ai_integration_test.dart test/integration/local_provider_integration_test.dart test/integration/ai_integration_test.dart test/integration/link_e2e_test.dart test/integration/agent_integration_test.dart test/integration/canvas_integration_test.dart test/integration/end_to_end_flow_test.dart test/core/ai/sse_stream_parser_test.dart test/ui/graph_canvas_compliance_test.dart test/ui/capture_scene_test.dart test/ui/scene_integration_test.dart
      - uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  plugin-test:
    name: Plugin Tests
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Plugin Host Core Tests
        run: flutter test test/plugin_host_test.dart --no-pub
      - name: Plugin Host Integration Tests
        run: flutter test test/plugin_host_integration_test.dart --no-pub
      - name: HelloWorld Plugin Tests
        run: flutter test test/plugins/hello_world_plugin_test.dart --no-pub
      - name: Skill System Tests
        run: flutter test test/plugins/skill_system_test.dart --no-pub
      - name: Dataview Plugin Tests
        run: flutter test test/dataview_test.dart --no-pub

  quick-moves-acceptance:
    name: Quick Moves Acceptance
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Quick Move Model Tests
        run: flutter test test/data/models/quick_move_test.dart --no-pub
      - name: Quick Move Service Tests
        run: flutter test test/services/quick_move_service_test.dart --no-pub
      - name: Quick Move Acceptance Tests (US-1 ~ US-7)
        run: flutter test test/acceptance/quick_moves_acceptance_test.dart --no-pub

  # NOTE: integration_test/ tests are NOT run in CI on purpose.
  # Those tests are real Flutter integration tests — `flutter test
  # integration_test/...` compiles the actual rfbrowser.exe with the
  # test file as main(), launches it, and attaches a Dart VM
  # debugger. The Flutter engine on Windows must create a real HWND
  # for this to work, and no github-hosted runner provides that
  # environment (the agent runs in a headless service session; we
  # tried 8+ PsExec cross-session variants in the git history of
  # this file and all of them end with
  # "log reader stopped unexpectedly").
  #
  # Instead, run them locally before each push:
  #   pwsh scripts/pre-push-integration-tests.ps1
  # The script runs each integration test file with a hard 5-minute
  # timeout and exits non-zero on the first failure so a failed run
  # blocks the push (if you wire it into a git pre-push hook).
  # If you ever want to put these back in CI, the only correct way
  # is a self-hosted Windows runner with a real logged-in desktop
  # session; see the integration-test-windows job in commit
  # 0756075 for the template (it had `runs-on: [self-hosted,
  # windows-desktop]` and full PsExec / query session / .bat wrapper
  # plumbing).

  cross-component-flow:
    name: Cross-Component Data Flow (G15-C)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Each test below is wrapped in a retry loop because the
      # sqlite3 dart package downloads a pre-compiled libsqlite3 at
      # first build time. The download is fetched from
      # github.com/simolus3/sqlite3.dart/releases and is occasionally
      # cut off mid-stream (HTTP "Connection closed before full
      # header was received"). The artifact is cached after the
      # first successful download, so retrying is sufficient: a
      # second attempt usually hits the cache and runs offline.
      - name: search → note → graph → canvas → AI (G13-D)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== attempt $i ==="
            if flutter test test/integration/end_to_end_flow_test.dart --no-pub; then
              exit 0
            fi
            echo "attempt $i failed, waiting 10s before retry"
            sleep 10
          done
          echo "all 5 attempts failed"
          exit 1
      - name: 5 canonical user journeys (G15-B)
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/user_journey_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: knowledge <-> index store sync
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/knowledge_integration_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: link <-> note repository sync
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/link_e2e_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: vault provider propagation
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/vault_integration_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1

  smoke-test-macos:
    name: Smoke Test (macOS)
    runs-on: macos-latest
    needs: [test]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze on macOS
        run: flutter analyze --no-pub
      - name: Run smoke tests on macOS
        run: flutter test --no-pub test/data/ test/services/ test/core/

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-linux
          path: build/linux/x64/release/bundle/
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # TODO(phase-5): add a build-macos job and include rfbrowser-macos in the
  # release archive. Skipped here because the project does not yet declare
  # `platforms: macos:` in pubspec.yaml and has no `macos/` directory; running
  # `flutter create --platforms=macos .` in CI would mutate the working tree
  # on every build. Add the platform locally with
  #   flutter create --platforms=macos .
  # then re-introduce the build-macos job + the macOS download/zip/upload
  # steps below.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-windows
          path: dist/windows/
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-linux
          path: dist/linux/
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-android
          path: dist/android/
      - name: Create release archive
        run: |
          cd dist/windows && zip -r ../../rfbrowser-windows.zip . && cd ../..
          cd dist/linux && tar czf ../../rfbrowser-linux.tar.gz . && cd ../..
          mv dist/android/app-release.apk rfbrowser-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rfbrowser-windows.zip
            rfbrowser-linux.tar.gz
            rfbrowser-android.apk
          generate_release_notes: true
