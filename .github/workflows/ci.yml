name: RFBrowser CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-pub --fatal-infos

  # TODO(phase-5): re-introduce Genome Constraints + Service Audit jobs once
  # the seeds/ directory is brought back or the constraint files are moved
  # into a different location. They were removed in 9c54089 ("Migrate
  # meta-harness from copy-paste to git submodule") but the workflow still
  # references them, so they fail with "No such file or directory" in ~5s.
  # Removing them from ci.yml unblocks the rest of the pipeline.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [analyze]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Configure git for tests
        # git_sync_service_test.dart exercises real `git commit` / `git push`
        # which fail on a clean ubuntu-latest runner because user.name and
        # user.email are not set; "Author identity unknown" aborts the
        # commit and the test then sees a silent no-op.
        run: |
          git config --global user.name  "RFBrowser CI"
          git config --global user.email "ci@rfbrowser.local"
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test --no-pub --coverage test/data/ test/services/ test/core/ test/acceptance/ test/security/ test/agents/ test/performance/ test/plugins/capability_checker_test.dart test/services/shortcut_service_test.dart test/services/git_merge_test.dart test/integration/browser_lifecycle_integration_test.dart test/integration/note_lifecycle_integration_test.dart test/integration/agent_bailian_integration_test.dart test/integration/local_provider_integration_test.dart test/integration/ai_integration_test.dart test/integration/link_e2e_test.dart test/integration/agent_integration_test.dart test/integration/canvas_integration_test.dart test/integration/end_to_end_flow_test.dart test/core/ai/sse_stream_parser_test.dart test/ui/graph_canvas_compliance_test.dart test/ui/capture_scene_test.dart test/ui/scene_integration_test.dart
      - uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  plugin-test:
    name: Plugin Tests
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Plugin Host Core Tests
        run: flutter test test/plugin_host_test.dart --no-pub
      - name: Plugin Host Integration Tests
        run: flutter test test/plugin_host_integration_test.dart --no-pub
      - name: HelloWorld Plugin Tests
        run: flutter test test/plugins/hello_world_plugin_test.dart --no-pub
      - name: Skill System Tests
        run: flutter test test/plugins/skill_system_test.dart --no-pub
      - name: Dataview Plugin Tests
        run: flutter test test/dataview_test.dart --no-pub

  quick-moves-acceptance:
    name: Quick Moves Acceptance
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Quick Move Model Tests
        run: flutter test test/data/models/quick_move_test.dart --no-pub
      - name: Quick Move Service Tests
        run: flutter test test/services/quick_move_service_test.dart --no-pub
      - name: Quick Move Acceptance Tests (US-1 ~ US-7)
        run: flutter test test/acceptance/quick_moves_acceptance_test.dart --no-pub

  integration-test-windows:
    # The 20 tests in integration_test/ are Flutter integration tests that
    # launch the actual rfbrowser.exe and attach a Dart VM debugger to it.
    # On the windows-2022 runner the GitHub Actions agent runs inside
    # Windows Session 0 (the service session), which has no interactive
    # desktop. The app's main() calls
    #     await windowManager.ensureInitialized();
    # at lib/main.dart:21, which blocks forever in Session 0 because the
    # Win32 CreateWindowEx call never returns when there is no desktop.
    # runApp() is never reached, the Dart VM never starts, the
    # integration_test framework's log reader times out, and the whole
    # job reports:
    #   "Error waiting for a debug connection: The log reader stopped
    #    unexpectedly, or never started."
    #
    # Fix: lift the test process out of Session 0 and into Session 1
    # (the first interactive console session) using PsExec from
    # Sysinternals. PsExec -i 1 makes the spawned process inherit the
    # interactive session's window-station/desktop, so windowManager
    # gets a real desktop heap, can allocate a window, and returns
    # from ensureInitialized() normally. After that, runApp() is
    # called, the Dart VM publishes its observatory URI on stdout,
    # the log reader picks it up, and the test proceeds.
    #
    # This is the same technique that every Windows CI vendor (Azure
    # Pipelines, AppVeyor, TeamCity) uses for GUI tests; the only
    # alternative is a self-hosted runner with a real logged-in user,
    # which is a much larger infrastructure change.
    name: Integration Tests (Windows)
    runs-on: windows-2022
    needs: [test, plugin-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Install PsExec (Sysinternals)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # Current canonical URL is the /files/ path; the bare
          # https://download.sysinternals.com/PSTools.zip URL now 404s.
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://download.sysinternals.com/files/PSTools.zip' `
            -OutFile "$env:RUNNER_TEMP\PSTools.zip"
          if ((Get-Item "$env:RUNNER_TEMP\PSTools.zip").Length -lt 1000000) {
            throw "PSTools.zip download looks too small ($((Get-Item $env:RUNNER_TEMP\PSTools.zip).Length) bytes) — got an HTML error page instead of the archive."
          }
          Expand-Archive -Path "$env:RUNNER_TEMP\PSTools.zip" `
            -DestinationPath "$env:RUNNER_TEMP\PSTools" -Force
          Copy-Item "$env:RUNNER_TEMP\PSTools\PsExec.exe" `
            -Destination "$env:RUNNER_TEMP\PsExec.exe" -Force
          Write-Host "PsExec installed at $env:RUNNER_TEMP\PsExec.exe"
      - name: Discover interactive session ID
        # windows-2022 does not always create Session 1; the actual
        # interactive console is whatever ID 'query session' shows with
        # STATE=Active and SESSIONNAME=console. Earlier we hard-coded
        # `psexec -i 1` and it failed immediately on this runner image
        # (no Session 1 — Windows jumped straight to Session 2 for the
        # GitHub Actions agent's interactive session). Parse 'query
        # session' to get the right ID at runtime.
        #
        # Implementation: use `shell: bash` (Git Bash) instead of
        # `shell: pwsh`. I tried four PowerShell variants
        # (Out-File, Add-Content -Encoding utf8, Add-Content
        # -Encoding utf8NoBOM, and .NET [System.IO.File]::AppendAllText
        # with UTF8Encoding($false)) and all four produced silent
        # exit code 1 with no PowerShell error in the log, but the
        # subsequent step still saw an empty $env:SESSION_ID. There
        # is something subtle about how pwsh and the GitHub Actions
        # runner interact on windows-2022 that I could not pin down
        # in a reasonable amount of time; bash's `>>` redirect is a
        # much simpler, much more reliable write path that
        # provably produces UTF-8 (no BOM) bytes.
        id: session
        shell: bash
        run: |
          # Disable errexit (set -e) for the discovery step. The
          # GitHub Actions runner invokes bash with `-e -o pipefail`
          # by default, and a sed/grep that returns no match
          # would trip pipefail and exit 1 with NO output captured
          # in the log. That is the failure mode we are trying to
          # avoid. We do explicit error handling below instead.
          set +e
          sessions=$(query session 2>&1)
          echo "=== query session ==="
          echo "$sessions"
          # `query session` may emit all sessions on a single line
          # if the terminal width is narrow, so we don't anchor on
          # a line-start `^`. Just look for ">console <user>
          # <id> Active" anywhere in the output.
          #
          # Use sed (POSIX-portable) instead of `grep -oP` so the
          # script does not depend on the PCRE build flag of grep
          # on the windows-2022 Git Bash (which historically has
          # been a moving target).
          session_id=$(echo "$sessions" \
            | sed -n 's/.*>console[[:space:]]\+[^[:space:]]\+[[:space:]]\+\([0-9][0-9]*\)[[:space:]]\+Active.*/\1/p' \
            | head -1)
          if [ -z "$session_id" ]; then
            echo "::error::No Active console session found in 'query session' output. The runner image likely has no interactive desktop at all; PsExec cannot help here."
            exit 1
          fi
          echo "=== using session id: $session_id ==="
          # Use uppercase SESSION_ID to match the $env:SESSION_ID
          # reads in the two test steps below. Although Windows
          # environment variables are case-insensitive when read
          # by a process, the GITHUB_ENV file parser is
          # case-sensitive (it builds a literal map keyed by
          # whatever case is on the `KEY=...` line), so a
          # `session_id=2` write would NOT be visible to
          # `$env:SESSION_ID` in the next step.
          echo "SESSION_ID=${session_id}" >> "$GITHUB_ENV"
      - name: Plugin Lifecycle Integration Test (interactive console)
        # PsExec spawns the test process in the agent's interactive
        # session (Session 2 on windows-2022) but the spawned process
        # does NOT see the agent's PATH. `subosito/flutter-action` adds
        # `flutter` to PATH only for the current process tree, so a
        # bare `flutter test ...` command inside PsExec fails with
        # "The system cannot find the file specified." (Win32 0x2).
        # Fix: invoke flutter by its absolute path
        # ($env:FLUTTER_ROOT\bin\flutter.bat). FLUTTER_ROOT is exported
        # by subosito/flutter-action and survives the env inheritance
        # chain; the spawned batch file is a normal .bat that Windows
        # CreateProcess can launch without any PATH lookup.
        #
        # We do NOT use a `--` separator: PsExec does not understand
        # the GNU option-terminator convention, treats `--` as the
        # program name, and prints the usage screen (we hit this
        # exact bug in 9693f83).
        #
        # The actual `flutter test` is invoked through a tiny .bat
        # wrapper we write to the runner temp directory. The wrapper
        # redirects stdout+stderr to a log file. Without this, PsExec
        # never relays flutter's output back to our step (we get only
        # "Starting ... on runnervm30ugi" and "exited with code 1",
        # nothing in between) and we cannot diagnose failures.
        shell: pwsh
        run: |
          $flutter = Join-Path $env:FLUTTER_ROOT 'bin\flutter.bat'
          if (-not (Test-Path $flutter)) {
            throw "flutter.bat not found at $flutter (FLUTTER_ROOT=$env:FLUTTER_ROOT)"
          }
          $wrapper = Join-Path $env:RUNNER_TEMP 'run_plugin_lifecycle_test.bat'
          $logPath = Join-Path $env:RUNNER_TEMP 'plugin_lifecycle_test.log'
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          $bat = @"
          @echo off
          "$flutter" test integration_test/plugin_lifecycle_test.dart --no-pub > "$logPath" 2>&1
          exit /b %ERRORLEVEL%
          "@
          [System.IO.File]::WriteAllText($wrapper, $bat, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Invoking $wrapper in session $env:SESSION_ID"
          & "$env:RUNNER_TEMP\PsExec.exe" `
            -i $env:SESSION_ID `
            -accepteula `
            -w $PWD `
            cmd.exe /c $wrapper
          $ec = $LASTEXITCODE
          Write-Host "==== flutter test output ===="
          if (Test-Path $logPath) {
            Get-Content $logPath -Raw | Write-Host
          } else {
            Write-Host "(no log file produced at $logPath)"
          }
          Write-Host "==== end of output ===="
          exit $ec
        env:
          # Tell lib/main.dart we are running inside an integration test,
          # so it can skip the windowManager.ensureInitialized() call
          # (which blocks forever in Session 0 / on a runner with no
          # interactive desktop) and go straight to runApp(). We use a
          # custom env var name (RFBROWSER_INTEGRATION_TEST) instead of
          # FLUTTER_TEST because the flutter test framework sets the
          # latter internally and would either override or conflict
          # with our value.
          RFBROWSER_INTEGRATION_TEST: 'true'
      - name: Plugin Settings UI Integration Test (interactive console)
        shell: pwsh
        run: |
          $flutter = Join-Path $env:FLUTTER_ROOT 'bin\flutter.bat'
          if (-not (Test-Path $flutter)) {
            throw "flutter.bat not found at $flutter (FLUTTER_ROOT=$env:FLUTTER_ROOT)"
          }
          $wrapper = Join-Path $env:RUNNER_TEMP 'run_plugin_settings_test.bat'
          $logPath = Join-Path $env:RUNNER_TEMP 'plugin_settings_test.log'
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          $bat = @"
          @echo off
          "$flutter" test integration_test/plugin_settings_test.dart --no-pub > "$logPath" 2>&1
          exit /b %ERRORLEVEL%
          "@
          [System.IO.File]::WriteAllText($wrapper, $bat, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Invoking $wrapper in session $env:SESSION_ID"
          & "$env:RUNNER_TEMP\PsExec.exe" `
            -i $env:SESSION_ID `
            -accepteula `
            -w $PWD `
            cmd.exe /c $wrapper
          $ec = $LASTEXITCODE
          Write-Host "==== flutter test output ===="
          if (Test-Path $logPath) {
            Get-Content $logPath -Raw | Write-Host
          } else {
            Write-Host "(no log file produced at $logPath)"
          }
          Write-Host "==== end of output ===="
          exit $ec
        env:
          RFBROWSER_INTEGRATION_TEST: 'true'

  cross-component-flow:
    name: Cross-Component Data Flow (G15-C)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Each test below is wrapped in a retry loop because the
      # sqlite3 dart package downloads a pre-compiled libsqlite3 at
      # first build time. The download is fetched from
      # github.com/simolus3/sqlite3.dart/releases and is occasionally
      # cut off mid-stream (HTTP "Connection closed before full
      # header was received"). The artifact is cached after the
      # first successful download, so retrying is sufficient: a
      # second attempt usually hits the cache and runs offline.
      - name: search → note → graph → canvas → AI (G13-D)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== attempt $i ==="
            if flutter test test/integration/end_to_end_flow_test.dart --no-pub; then
              exit 0
            fi
            echo "attempt $i failed, waiting 10s before retry"
            sleep 10
          done
          echo "all 5 attempts failed"
          exit 1
      - name: 5 canonical user journeys (G15-B)
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/user_journey_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: knowledge <-> index store sync
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/knowledge_integration_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: link <-> note repository sync
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/link_e2e_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: vault provider propagation
        run: |
          for i in 1 2 3; do
            if flutter test test/integration/vault_integration_test.dart --no-pub; then exit 0; fi
            sleep 5
          done
          exit 1

  smoke-test-macos:
    name: Smoke Test (macOS)
    runs-on: macos-latest
    needs: [test]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze on macOS
        run: flutter analyze --no-pub
      - name: Run smoke tests on macOS
        run: flutter test --no-pub test/data/ test/services/ test/core/

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-linux
          path: build/linux/x64/release/bundle/
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # TODO(phase-5): add a build-macos job and include rfbrowser-macos in the
  # release archive. Skipped here because the project does not yet declare
  # `platforms: macos:` in pubspec.yaml and has no `macos/` directory; running
  # `flutter create --platforms=macos .` in CI would mutate the working tree
  # on every build. Add the platform locally with
  #   flutter create --platforms=macos .
  # then re-introduce the build-macos job + the macOS download/zip/upload
  # steps below.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-windows
          path: dist/windows/
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-linux
          path: dist/linux/
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-android
          path: dist/android/
      - name: Create release archive
        run: |
          cd dist/windows && zip -r ../../rfbrowser-windows.zip . && cd ../..
          cd dist/linux && tar czf ../../rfbrowser-linux.tar.gz . && cd ../..
          mv dist/android/app-release.apk rfbrowser-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rfbrowser-windows.zip
            rfbrowser-linux.tar.gz
            rfbrowser-android.apk
          generate_release_notes: true
