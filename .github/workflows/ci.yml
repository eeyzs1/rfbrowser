name: RFBrowser CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-pub --fatal-infos

  constraints:
    name: Genome Constraints
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check genome constraints
        run: python seeds/orchestrator.py --check-constraints

  audit-services:
    name: Service Audit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run service layer audit
        run: python seeds/tools/audit_services.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [analyze, constraints, audit-services]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test --no-pub --coverage test/data/ test/services/ test/core/ test/acceptance/ test/security/ test/agents/ test/performance/ test/plugins/capability_checker_test.dart test/services/shortcut_service_test.dart test/services/git_merge_test.dart test/integration/browser_lifecycle_integration_test.dart test/integration/note_lifecycle_integration_test.dart test/integration/agent_bailian_integration_test.dart test/integration/local_provider_integration_test.dart test/integration/ai_integration_test.dart test/integration/link_e2e_test.dart test/integration/agent_integration_test.dart test/integration/canvas_integration_test.dart test/integration/end_to_end_flow_test.dart test/core/ai/sse_stream_parser_test.dart test/ui/graph_canvas_compliance_test.dart test/ui/capture_scene_test.dart test/ui/scene_integration_test.dart
      - uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  plugin-test:
    name: Plugin Tests
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Plugin Host Core Tests
        run: flutter test test/plugin_host_test.dart --no-pub
      - name: Plugin Host Integration Tests
        run: flutter test test/plugin_host_integration_test.dart --no-pub
      - name: HelloWorld Plugin Tests
        run: flutter test test/plugins/hello_world_plugin_test.dart --no-pub
      - name: Skill System Tests
        run: flutter test test/plugins/skill_system_test.dart --no-pub
      - name: Dataview Plugin Tests
        run: flutter test test/dataview_test.dart --no-pub

  quick-moves-acceptance:
    name: Quick Moves Acceptance
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Quick Move Model Tests
        run: flutter test test/data/models/quick_move_test.dart --no-pub
      - name: Quick Move Service Tests
        run: flutter test test/services/quick_move_service_test.dart --no-pub
      - name: Quick Move Acceptance Tests (US-1 ~ US-7)
        run: flutter test test/acceptance/quick_moves_acceptance_test.dart --no-pub

  integration-test-windows:
    name: Integration Tests (Windows)
    runs-on: windows-latest
    needs: [test, plugin-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Plugin Lifecycle Integration Test
        run: flutter test integration_test/plugin_lifecycle_test.dart
      - name: Plugin Settings UI Integration Test
        run: flutter test integration_test/plugin_settings_test.dart

  cross-component-flow:
    name: Cross-Component Data Flow (G15-C)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: search → note → graph → canvas → AI (G13-D)
        run: flutter test test/integration/end_to_end_flow_test.dart --no-pub
      - name: 5 canonical user journeys (G15-B)
        run: flutter test test/integration/user_journey_test.dart --no-pub
      - name: knowledge <-> index store sync
        run: flutter test test/integration/knowledge_integration_test.dart --no-pub
      - name: link <-> note repository sync
        run: flutter test test/integration/link_e2e_test.dart --no-pub
      - name: vault provider propagation
        run: flutter test test/integration/vault_lifecycle_test.dart --no-pub

  smoke-test-macos:
    name: Smoke Test (macOS)
    runs-on: macos-latest
    needs: [test]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze on macOS
        run: flutter analyze --no-pub
      - name: Run smoke tests on macOS
        run: flutter test --no-pub test/data/ test/services/ test/core/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-linux
          path: build/linux/x64/release/bundle/
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test, plugin-test, quick-moves-acceptance]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfbrowser-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-android, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-windows
          path: dist/windows/
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-linux
          path: dist/linux/
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-android
          path: dist/android/
      - uses: actions/download-artifact@v4
        with:
          name: rfbrowser-macos
          path: dist/macos/
      - name: Create release archive
        run: |
          cd dist/windows && zip -r ../../rfbrowser-windows.zip . && cd ../..
          cd dist/linux && tar czf ../../rfbrowser-linux.tar.gz . && cd ../..
          mv dist/android/app-release.apk rfbrowser-android.apk
          cd dist/macos && zip -r ../../rfbrowser-macos.zip . && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rfbrowser-windows.zip
            rfbrowser-linux.tar.gz
            rfbrowser-android.apk
            rfbrowser-macos.zip
          generate_release_notes: true
