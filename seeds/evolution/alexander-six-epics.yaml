archived_epics:
  - id: Epic-D
    name: "统一模型层"
    principle: "正空间"
    completed_at: "2026-05-08"
    outcome: |
      canvas_model.dart → lib/data/models/, ai_provider.dart → lib/data/models/,
      model_discovery.dart → lib/core/domain/, lib/core/model/ 目录已删除。
      所有 import 已更新，flutter analyze 通过。

  - id: Epic-F
    name: "让基因组呼吸"
    principle: "有机秩序"
    completed_at: "2026-05-06"
    outcome: |
      genome.yaml 活跃约束 ≤ 20 条，休眠约束归档到 dormant-constraints.yaml。
      orchestrator.py --check-constraints 只报告 active 约束违规。
      每条约束有 status 字段（active/dormant/verified-needed/archived）。

  - id: Epic-E
    name: "修剪服务层"
    principle: "房间不是墙内的空洞"
    completed_at: "2026-05-08"
    outcome: |
      删除 template_service, update_check_service, plugin_registry_service,
      clipper_service, skill_service。保留 14 个核心服务。
      audit_services.py 审计脚本可用。

  - id: Epic-B
    name: "分解 KnowledgeNotifier"
    principle: "层级中心"
    completed_at: "2026-05-08"
    outcome: |
      拆分为 NoteNotifier (note_service.dart), LinkNotifier (link_service.dart),
      SearchNotifier (search_service.dart)。旧 knowledgeProvider 已标记 deprecated。
      UI 层消费者已迁移到新 Provider。

  - id: Epic-C
    name: "场景独立房间"
    principle: "房间的壁炉"
    completed_at: "2026-05-11"
    outcome: |
      创建 capture_scene.dart, think_scene.dart, connect_scene.dart。
      MainLayout 瘦身为场景编排 + 快捷键。StatusBar 提取为独立 widget。
      场景切换 Ctrl+1/2/3 正常工作。

Epic_A:
  id: Epic-A
  name: "将 AI 编织进每个场景"
  status: partial
  principle: "壁炉中的火焰 — AI 应该是每个场景的壁炉"
  problem: |
    AIFloat 仍作为全局浮动按钮存在于所有三个场景中。
    AI 尚未场景化：Capture 缺少网页摘要入口，Think 缺少内联 AI 菜单，
    Connect 缺少隐藏关联发现。
  target: |
    - 移除 AIFloat 全局浮动按钮
    - Capture: AI 摘要面板替换右侧占位符
    - Think: 内联 AI 菜单（改进/翻译/续写/语法）
    - Connect: AI 发现隐藏关联面板
    - 每个场景有专属快捷键

  key_acceptance_criteria:
    - id: AC-A-1-1
      description: "Capture 场景有 AI 交互入口（工具按钮或快捷键）"
    - id: AC-A-1-2
      description: "快捷键 Ctrl+Shift+S 触发当前页面摘要"
    - id: AC-A-2-1
      description: "Think 场景选中文本后显示 AI 操作菜单"
    - id: AC-A-2-2
      description: "快捷键 Ctrl+K 触发 AI 改进当前段落"
    - id: AC-A-3-1
      description: "Connect 场景有'发现隐藏关联'按钮"
    - id: AC-A-4-1
      description: "AIFloat widget 不再被任何场景引用"
    - id: AC-A-5-1
      description: "AI 响应使用流式 SSE，每个 token 更新 UI"

  remaining_work:
    - "创建 capture_ai_toolbar.dart — Capture AI 摘要/提问/摘录"
    - "创建 think_inline_ai_menu.dart — Think 内联 AI 菜单"
    - "创建 connect_ai_discovery.dart — Connect AI 发现面板"
    - "从三个场景中移除 AIFloat 引用"
    - "添加 Ctrl+Shift+S / Ctrl+K / Ctrl+Shift+D 快捷键"

global_acceptance_criteria:
  - "flutter analyze passes with 0 issues"
  - "all existing tests still pass"
  - "AIFloat no longer referenced in any scene"
  - "every scene has exactly one AI entry point"
  - "AI streaming output visible in all scenes"
