version: 3
description: Evolved genome for RFBrowser — deduplicated with AGENTS.md. Rules referenced,
  not duplicated.
dedup_note: Constraints C010-C048 previously duplicated AGENTS.md rules. Now they
  reference AGENTS.md instead of repeating full text.
harness_genome:
  active_constraints:
  - id: C001
    rule: every task must have acceptance criteria
    source: initial design
    last_triggered: '2026-05-06'
    trigger_count: 1
    status: active
  - id: C002
    rule: no agent self-certifies — every completed criterion needs external evidence
    source: initial design
    last_triggered: '2026-05-07'
    trigger_count: 1
    status: verified-needed
  - id: C003
    rule: every mistake produces a new constraint
    source: initial design
    last_triggered: '2026-05-06'
    trigger_count: 1
    status: active
  - id: C004
    rule: CustomPainter.shouldRepaint must compare actual data, not just return true
    source: 'meta-mistake: P-2 evidence'
    last_triggered: '2026-05-06'
    trigger_count: 1
    status: active
  - id: C005
    rule: every class using SharedPreferences must cache the instance (lazy singleton)
    source: 'meta-mistake: P-3 evidence'
    last_triggered: '2026-05-06'
    trigger_count: 1
    status: active
  - id: C006
    rule: no empty catch blocks — every catch must log or rethrow
    source: 'meta-mistake: silent error swallowing'
    last_triggered: '2026-05-06'
    trigger_count: 17
    status: active
  - id: C007
    rule: use dart:convert for JSON — never write manual parsers
    source: 'meta-mistake: manual JSON parser'
    last_triggered: '2026-05-06'
    trigger_count: 1
    status: active
  - id: C008
    rule: no duplicate business logic between UI and service layers — extract to model
    source: 'meta-mistake: A-2 evidence'
    last_triggered: '2026-05-06'
    trigger_count: 1
    status: active
  - id: C009
    rule: after harness generation, run domain-adaptation pass
    source: 'meta-mistake: generic paths in Flutter project'
    last_triggered: '2026-05-06'
    trigger_count: 1
    status: active
  - id: C037
    rule: Windows path.relative() returns backslash — always replaceAll('\\', '/')
      before splitting by '/'
    ref: AGENTS.md C-5
    source: 'meta-mistake: Windows path separators'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C038
    rule: Tree structures with parentId must prevent self-referencing — add cycle
      detection
    ref: AGENTS.md C-6
    source: 'meta-mistake: BookmarkFolder self-reference'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C039
    rule: After moveNote or file-system mutation, call loadAllNotes() to refresh state
    ref: AGENTS.md P-5
    source: 'meta-mistake: moveNote UI did not refresh'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C040
    rule: Bookmark and vault data must be persisted to disk (JSON in vault/.rfbrowser/)
    ref: AGENTS.md S-4
    source: 'meta-mistake: bookmarks lost on restart'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C041
    rule: Vault-specific data in <vault>/.rfbrowser/, app config in <ApplicationSupport>/
    ref: AGENTS.md A-8
    source: 'meta-mistake: vault data in wrong location'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C042
    rule: Disk folder scanning must filter hidden and system directories
    ref: AGENTS.md A-9
    source: 'meta-mistake: hidden dirs in note tree'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C043
    rule: Font sizes in sidebars must follow user settings, not hardcoded values
    ref: AGENTS.md U-4
    source: 'meta-mistake: hardcoded font sizes'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C044
    rule: AI panels must always have a back/reset button visible after generating
      content
    ref: AGENTS.md U-5
    source: 'meta-mistake: no way back from AI panel'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C045
    rule: Bookmark clicks must actually navigate WebView — use createTab(url:) or
      loadUrl()
    ref: AGENTS.md U-6
    source: 'meta-mistake: bookmark clicks did not navigate'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C046
    rule: Vault switching must be accessible from main layout, not just welcome page
    ref: AGENTS.md UX-8
    source: 'meta-mistake: vault switcher hidden'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C047
    rule: AI summary should support both web pages and notes with a toggle
    ref: AGENTS.md UX-9
    source: 'meta-mistake: AI summary only for web'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C048
    rule: AI-generated content must have a save-as-note action button
    ref: AGENTS.md UX-10
    source: 'meta-mistake: no save-as-note action'
    last_triggered: '2026-05-08'
    trigger_count: 1
    status: active
  - id: C049
    rule: FocusNode must not be disposed while hasFocus is true
    source: 'meta-mistake: FocusNode disposed while focused'
    last_triggered: '2026-05-11'
    trigger_count: 1
    status: active
  - id: C050
    rule: Never call setState on every frame for camera/scroll state — use ChangeNotifier
      + ListenableBuilder
    source: 'meta-mistake: canvas setState on every pan/zoom frame'
    last_triggered: '2026-05-11'
    trigger_count: 1
    status: active
  - id: C051
    rule: Every clickable element must be hit-tested in onScaleStart
    source: 'meta-mistake: connection line unselectable'
    last_triggered: '2026-05-11'
    trigger_count: 1
    status: active
  agents_md_rules:
    description: These rules are enforced by AGENTS.md. Listed here for orchestrator
      constraint checking only.
    rules:
    - id: C010
      ref: AGENTS.md P-1
      rule: never persist to disk on every frame — use debounced save
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C011
      ref: AGENTS.md C-1
      rule: API response parsing must be defensive — null-check every level
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C012
      ref: AGENTS.md C-2
      rule: concurrent state mutations must be guarded — check isLoading
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C013
      ref: AGENTS.md C-3
      rule: calculate new active index BEFORE removing item from list
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C014
      ref: AGENTS.md C-4
      rule: copyWith cannot set nullable fields to null — use sentinel values
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C015
      ref: AGENTS.md S-1
      rule: WebView must filter dangerous URL schemes in shouldOverrideUrlLoading
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C016
      ref: AGENTS.md S-2
      rule: API keys must not be stored in observable state — use flutter_secure_storage
