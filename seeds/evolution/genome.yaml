agent_genome:
  topology_rules:
  - always add verifier
  - merge tightly coupled roles
  - split when context exceeds budget
  default_scope:
    max_context_lines: 60
    handoff_format: structured YAML
  domain_specific_roles:
    planner:
      responsibilities:
      - design Flutter widget contracts
      - define component structure
      - create task decomposition
    executor:
      responsibilities:
      - implement Flutter widgets
      - write Dart code
      - fix bugs
      - run flutter analyze
    verifier:
      responsibilities:
      - run flutter test
      - check consistency
      - validate AGENTS.md rule compliance
evolution_genome:
  fitness_weights:
    evidence_satisfaction_rate: 0.35
    loop_efficiency: 0.25
    root_cause_hit_rate: 0.2
    goal_drift_rate: 0.2
  mutation_rate: 0.1
  selection_threshold: fitness must improve or complexity must decrease
  safety_constraints:
  - never remove verification layer
  - never remove evolution system
  - mutation rate <= 30%
  - all mutations reversible
  evidence_log:
  - date: '2026-05-06'
    type: code_quality_fix
    details: Fixed 17 lint issues; SharedPreferences cached; shouldRepaint compares
      data; duplicate code extracted
    fitness_delta: 0.35
  - date: '2026-05-06'
    type: harness_evolution
    details: Created execution layer; adapted paths to Flutter; evolved genome with
      36 constraints from AGENTS.md
    fitness_delta: 0.25
  - date: '2026-05-07'
    type: genome_activation
    details: Activated all 26 dormant constraints — full genome now operational
    fitness_delta: 0.2
  - date: '2026-05-08'
    type: ux_storage_refactor
    details: 'Major UX and storage refactor: bookmark folders, note Trie tree, persistence,
      vault config migration. Added 12 new constraints.'
    fitness_delta: 0.3
  - date: '2026-05-13'
    type: genome_dedup
    details: Deduplicated genome.yaml with AGENTS.md. Merged dormant-constraints.yaml
      into genome. Compressed from 15.5 KB.
    fitness_delta: 0.1
