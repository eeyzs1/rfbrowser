      status: active
      trigger_count: 1
      last_triggered: '2026-05-06'
    - id: C020
      ref: AGENTS.md A-3
      rule: identical dialog code across pages must be extracted
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C021
      ref: AGENTS.md A-4
      rule: separate concerns — UI theme and AI config change for different reasons
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C022
      ref: AGENTS.md A-5
      rule: canvas cards with noteId must render live note data
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C023
      ref: AGENTS.md A-6
      rule: auto-discovered connections must be visually distinct from manual ones
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C024
      ref: AGENTS.md A-7
      rule: canvas persistence should use .json in vault/.rf/
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C025
      ref: AGENTS.md U-1
      rule: error dismiss buttons must actually clear the error state
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C026
      ref: AGENTS.md U-2
      rule: canvas clipping must happen BEFORE drawing
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C027
      ref: AGENTS.md U-3
      rule: row overflow must use Flexible + TextOverflow.ellipsis
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C028
      ref: AGENTS.md F-1
      rule: DropdownButtonFormField.value deprecated — use ValueKey
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C029
      ref: AGENTS.md F-2
      rule: Matrix4.translate()/scale() deprecated — set entries directly
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C030
      ref: AGENTS.md F-7
      rule: never assign TextEditingController.text inside build() unconditionally
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C031
      ref: AGENTS.md UX-1
      rule: every backend service must have at least one user-accessible trigger
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C032
      ref: AGENTS.md UX-2
      rule: empty states must guide the user with a call-to-action
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C033
      ref: AGENTS.md UX-3
      rule: destructive actions require confirmation
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C034
      ref: AGENTS.md UX-4
      rule: AI streaming output is core UX — users should see tokens in real-time
