      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C017
      ref: AGENTS.md S-3
      rule: path sanitization with replaceAll('..') is insufficient — use normalization
      status: active
      trigger_count: 1
      last_triggered: '2026-05-07'
    - id: C018
      ref: AGENTS.md A-1
      rule: every component must have at least one data flow path to another
