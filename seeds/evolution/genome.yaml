version: 4
description: RFBrowser harness genome — project-specific constraints only.
  AGENTS.md rules (P-1 through UX-15) are the authoritative source;
  this file tracks only constraints NOT already covered by AGENTS.md.
harness_genome:
  active_constraints:
  - id: C001
    rule: every task must have acceptance criteria
    source: initial design
    last_triggered: '2026-05-06'
    trigger_count: 1
  - id: C002
    rule: no agent self-certifies — every completed criterion needs external evidence
    source: initial design
    last_triggered: '2026-05-07'
    trigger_count: 1
    status: verified-needed
  - id: C003
    rule: every mistake produces a new constraint
    source: initial design
    last_triggered: '2026-05-06'
    trigger_count: 1
  - id: C004
    rule: CustomPainter.shouldRepaint must compare actual data, not just return true
    source: 'meta-mistake: P-2 evidence'
    ref: AGENTS.md P-2
    last_triggered: '2026-05-06'
    trigger_count: 1
  - id: C005
    rule: every class using SharedPreferences must cache the instance (lazy singleton)
    source: 'meta-mistake: P-3 evidence'
    ref: AGENTS.md P-3
    last_triggered: '2026-05-06'
    trigger_count: 1
  - id: C006
    rule: no empty catch blocks — every catch must log or rethrow
    source: 'meta-mistake: silent error swallowing'
    last_triggered: '2026-05-06'
    trigger_count: 17
  - id: C007
    rule: use dart:convert for JSON — never write manual parsers
    source: 'meta-mistake: manual JSON parser'
    last_triggered: '2026-05-06'
    trigger_count: 1
  - id: C008
    rule: no duplicate business logic between UI and service layers — extract to model
    source: 'meta-mistake: A-2 evidence'
    ref: AGENTS.md A-2
    last_triggered: '2026-05-06'
    trigger_count: 1
  - id: C009
    rule: after harness generation, run domain-adaptation pass
    source: 'meta-mistake: generic paths in Flutter project'
    last_triggered: '2026-05-06'
    trigger_count: 1
  - id: C037
    rule: Windows path.relative() returns backslash — always replaceAll('\\', '/')
      before splitting by '/'
    ref: AGENTS.md C-5
    source: 'meta-mistake: Windows path separators'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C038
    rule: Tree structures with parentId must prevent self-referencing — add cycle
      detection
    ref: AGENTS.md C-6
    source: 'meta-mistake: BookmarkFolder self-reference'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C039
    rule: After moveNote or file-system mutation, call loadAllNotes() to refresh state
    ref: AGENTS.md P-5
    source: 'meta-mistake: moveNote UI did not refresh'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C040
    rule: Bookmark and vault data must be persisted to disk (JSON in vault/.rfbrowser/)
    ref: AGENTS.md S-4
    source: 'meta-mistake: bookmarks lost on restart'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C041
    rule: Vault-specific data in <vault>/.rfbrowser/, app config in <ApplicationSupport>/
    ref: AGENTS.md A-8
    source: 'meta-mistake: vault data in wrong location'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C042
    rule: Disk folder scanning must filter hidden and system directories
    ref: AGENTS.md A-9
    source: 'meta-mistake: hidden dirs in note tree'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C043
    rule: Font sizes in sidebars must follow user settings, not hardcoded values
    ref: AGENTS.md U-4
    source: 'meta-mistake: hardcoded font sizes'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C044
    rule: AI panels must always have a back/reset button visible after generating
      content
    ref: AGENTS.md U-5
    source: 'meta-mistake: no way back from AI panel'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C045
    rule: Bookmark clicks must actually navigate WebView — use createTab(url:) or
      loadUrl()
    ref: AGENTS.md U-6
    source: 'meta-mistake: bookmark clicks did not navigate'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C046
    rule: Vault switching must be accessible from main layout, not just welcome page
    ref: AGENTS.md UX-8
    source: 'meta-mistake: vault switcher hidden'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C047
    rule: AI summary should support both web pages and notes with a toggle
    ref: AGENTS.md UX-9
    source: 'meta-mistake: AI summary only for web'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C048
    rule: AI-generated content must have a save-as-note action button
    ref: AGENTS.md UX-10
    source: 'meta-mistake: no save-as-note action'
    last_triggered: '2026-05-08'
    trigger_count: 1
  - id: C049
    rule: FocusNode must not be disposed while hasFocus is true
    source: 'meta-mistake: FocusNode disposed while focused'
    last_triggered: '2026-05-11'
    trigger_count: 1
  - id: C050
    rule: Never call setState on every frame for camera/scroll state — use ChangeNotifier
      + ListenableBuilder
    source: 'meta-mistake: canvas setState on every pan/zoom frame'
    last_triggered: '2026-05-11'
    trigger_count: 1
  - id: C051
    rule: Every clickable element must be hit-tested in onScaleStart
    source: 'meta-mistake: connection line unselectable'
    last_triggered: '2026-05-11'
    trigger_count: 1
  workflows:
  - id: W001
    name: base flow
    steps:
    - define
    - plan
    - execute
    - verify
    - record
    source: initial design
  - id: W002
    name: harness-evolution
    steps:
    - analyze_gaps
    - create_layers
    - adapt_paths
    - update_genome
    - verify_completeness
    source: harness-evolution-cycle
    enabled: true
  skills:
  - id: S001
    name: self-verify
    source: initial design
  - id: S002
    name: task-decompose
    source: initial design
  - id: S003
    name: flutter-analyze
    source: 'execution layer: task-runner.py'
  - id: S004
    name: flutter-test
    source: 'execution layer: task-runner.py'
  - id: S005
    name: genome-evolution
    source: 'harness-evolution: integrate AGENTS.md rules as constraints'
    status: applied
evolution_genome:
  fitness_weights:
    evidence_satisfaction_rate: 0.35
    loop_efficiency: 0.25
    root_cause_hit_rate: 0.2
    goal_drift_rate: 0.2
  mutation_rate: 0.1
  selection_threshold: fitness must improve or complexity must decrease
  safety_constraints:
  - never remove verification layer
  - never remove evolution system
  - mutation rate <= 30%
  - all mutations reversible
  evidence_log:
  - date: '2026-05-06'
    type: code_quality_fix
    details: Fixed 17 lint issues; SharedPreferences cached; shouldRepaint compares
      data; duplicate code extracted
    fitness_delta: 0.35
  - date: '2026-05-06'
    type: harness_evolution
    details: Created execution layer; adapted paths to Flutter; evolved genome with
      36 constraints from AGENTS.md
    fitness_delta: 0.25
  - date: '2026-05-07'
    type: genome_activation
    details: Activated all 26 dormant constraints — full genome now operational
    fitness_delta: 0.2
  - date: '2026-05-08'
    type: ux_storage_refactor
    details: 'Major UX and storage refactor: bookmark folders, note Trie tree, persistence,
      vault config migration. Added 12 new constraints.'
    fitness_delta: 0.3
  - date: '2026-05-13'
    type: genome_dedup
    details: Deduplicated genome.yaml with AGENTS.md. Merged dormant-constraints.yaml
      into genome. Compressed from 15.5 KB.
    fitness_delta: 0.1
  - date: '2026-05-18'
    type: harness_cleanup
    details: Removed 30+ generic template files, deduplicated genome, fixed script
      paths, simplified harness to essentials only.
    fitness_delta: 0.15
